<!DOCTYPE html>

            padding: 20px;
            border-radius: 8px;

        h2 {

        }
        .data-item {
            display: flex;
            justify-content: flex-start;
            margin: 10px 0;
        }
        .label {
            width: 30%;
            font-weight: bold;
            color: #333;
        }
        .value {
            width: 70%;
            color: #555;
        }

</head>

</body>
</html>
